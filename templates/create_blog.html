<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Blog - iBlog</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 2rem 0;
        }
        .navbar {
            background: white;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            padding: 1rem 0;
            margin-bottom: 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .nav-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #667eea;
            color: #667eea;
        }
        .btn-outline:hover {
            background: #667eea;
            color: white;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 2rem;
        }
        .create-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        .create-header h1 {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 0.5rem;
        }
        .create-header p {
            color: #666;
            font-size: 1.1rem;
        }
        .blog-form-container {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            position: relative;
        }
        .form-section {
            margin-bottom: 2rem;
        }
        .form-section label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 600;
            font-size: 1.1rem;
        }
        .form-section input,
        .form-section select,
        .form-section textarea {
            width: 100%;
            padding: 1rem;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }
        .form-section input:focus,
        .form-section select:focus,
        .form-section textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .content-editor {
            min-height: 300px;
            resize: vertical;
        }
        .nlp-tools {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin: 1rem 0;
            padding: 1.5rem;
            background: #f8f9fa;
            border-radius: 12px;
        }
        .nlp-btn {
            background: white;
            border: 2px solid #e1e5e9;
            padding: 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: #333;
        }
        .nlp-btn:hover {
            border-color: #667eea;
            color: #667eea;
            transform: translateY(-2px);
        }
        .nlp-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .translation-panel {
            display: none;
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 12px;
            margin-top: 1rem;
        }
        .translation-controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .publish-section {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 2px solid #e1e5e9;
        }
        .publish-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-large {
            padding: 1rem 2rem;
            font-size: 1.1rem;
            min-width: 150px;
        }
        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }
        .alert-success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .alert-error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .loading {
            display: none;
            text-align: center;
            margin: 1rem 0;
        }
        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 0.5rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .feature-info {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            text-align: center;
        }
        .feature-info h3 {
            margin-bottom: 0.5rem;
        }
        @media (max-width: 768px) {
            .nlp-tools {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            }
            .blog-form-container {
                padding: 2rem 1rem;
            }
            .publish-actions {
                flex-direction: column;
                align-items: center;
            }
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 0;
            border-radius: 20px;
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .modal-header {
            padding: 2rem;
            border-bottom: 2px solid #e1e5e9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h2 {
            margin: 0;
            color: #333;
        }
        .close-btn {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: #666;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .close-btn:hover {
            color: #333;
        }
        .modal-body {
            padding: 2rem;
        }
        .modal-footer {
            padding: 2rem;
            border-top: 2px solid #e1e5e9;
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }
        .preview-blog {
            max-width: 100%;
        }
        .preview-image {
            margin-bottom: 2rem;
            text-align: center;
        }
        .preview-image img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .preview-meta {
            margin-bottom: 2rem;
        }
        .preview-meta h1 {
            color: #333;
            margin-bottom: 1rem;
            font-size: 2rem;
        }
        .preview-details {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            color: #666;
            font-size: 0.9rem;
        }
        .preview-content {
            line-height: 1.8;
            color: #333;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        @media (max-width: 768px) {
            .modal-content {
                margin: 2% auto;
                width: 95%;
            }
            .modal-header, .modal-body, .modal-footer {
                padding: 1rem;
            }
            .preview-details {
                flex-direction: column;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">iBlog</div>
            <div class="nav-actions">
                <a href="/" class="btn btn-outline">
                    <i class="fas fa-home"></i> Home
                </a>
                <a href="/blogs" class="btn btn-outline">
                    <i class="fas fa-blog"></i> View Blogs
                </a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="create-header">
            <h1>Create New Blog Post</h1>
            <p>Share your thoughts with the world using our advanced writing tools</p>
        </div>

        <div class="feature-info">
            <h3><i class="fas fa-magic"></i> AI-Powered Writing Tools</h3>
            <p>Use voice-to-text, auto-correction, translation, and summarization to enhance your writing experience</p>
        </div>

        <div class="blog-form-container">
            <div class="alert alert-success" id="success-alert"></div>
            <div class="alert alert-error" id="error-alert"></div>

            <form id="blog-form">
                <div class="form-section">
                    <label for="title">Blog Title</label>
                    <input type="text" id="title" name="title" placeholder="Enter an engaging title for your blog post" required>
                </div>

                <div class="form-section">
                    <label for="author">Author Name</label>
                    <input type="text" id="author" name="author" placeholder="Your name" required>
                </div>

                <div class="form-section">
                    <label for="category">Category</label>
                    <select id="category" name="category" required>
                        <option value="">Select a category</option>
                        <option value="Technology">Technology</option>
                        <option value="Health">Health</option>
                        <option value="Lifestyle">Lifestyle</option>
                        <option value="Travel">Travel</option>
                        <option value="Food">Food</option>
                        <option value="Business">Business</option>
                        <option value="Education">Education</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Sports">Sports</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-section">
                    <label for="image">Featured Image URL (optional)</label>
                    <input type="url" id="image" name="image" placeholder="https://example.com/image.jpg">
                </div>

                <div class="form-section">
                    <label for="content">Content</label>

                    <div class="nlp-tools">
                        <button type="button" class="nlp-btn" id="correct-btn">
                            <i class="fas fa-spell-check"></i> Auto-Correct
                        </button>
                        <button type="button" class="nlp-btn" id="translate-btn">
                            <i class="fas fa-language"></i> Translate
                        </button>
                        <button type="button" class="nlp-btn" id="summarize-btn">
                            <i class="fas fa-compress-alt"></i> Summarize
                        </button>
                    </div>



                    <div class="translation-panel" id="translation-panel">
                        <div class="translation-controls">
                            <select id="translate-lang">
                                <option value="es">Spanish</option>
                                <option value="fr">French</option>
                                <option value="de">German</option>
                                <option value="it">Italian</option>
                                <option value="pt">Portuguese</option>
                                <option value="ru">Russian</option>
                                <option value="ja">Japanese</option>
                                <option value="ko">Korean</option>
                                <option value="zh">Chinese</option>
                                <option value="hi">Hindi</option>
                            </select>
                            <button type="button" class="btn" id="do-translate">Translate</button>                            <button type="button" class="btn btn-outline" id="close-translate">Close</button>
                        </div>
                        <textarea id="translation-result" placeholder="Translation will appear here..." readonly></textarea>
                    </div>

                    <textarea id="content" name="content" class="content-editor" placeholder="Start writing your amazing blog post here..." required></textarea>
                </div>

                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Processing...</p>
                </div>

                <div class="publish-section">
                    <div class="publish-actions">
                        <button type="button" class="btn btn-outline btn-large" id="preview-btn">
                            <i class="fas fa-eye"></i> Preview
                        </button>
                        <button type="submit" class="btn btn-large" id="publish-btn">
                            <i class="fas fa-paper-plane"></i> Publish Blog
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Preview Modal -->
        <div id="preview-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Blog Preview</h2>
                    <button class="close-btn" id="close-preview">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="preview-blog">
                        <div class="preview-image">
                            <img id="preview-img" src="" alt="Blog Image">
                        </div>
                        <div class="preview-meta">
                            <h1 id="preview-title"></h1>
                            <div class="preview-details">
                                <span class="preview-author">By <span id="preview-author"></span></span>
                                <span class="preview-category">Category: <span id="preview-category"></span></span>
                                <span class="preview-date">Date: <span id="preview-date"></span></span>
                            </div>
                        </div>
                        <div class="preview-content" id="preview-content"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline" id="edit-btn">Edit</button>
                    <button class="btn" id="confirm-publish">Publish</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize variables

        // Preview functionality
        document.getElementById('preview-btn').addEventListener('click', function() {
            const title = document.getElementById('title').value.trim();
            const author = document.getElementById('author').value.trim();
            const category = document.getElementById('category').value;
            const image = document.getElementById('image').value.trim() || 'https://via.placeholder.com/400x200';
            const content = document.getElementById('content').value.trim();

            // Validate required fields
            if (!title || !author || !category || !content) {
                alert('Please fill in all required fields before previewing.');
                return;
            }

            // Populate preview modal
            document.getElementById('preview-title').textContent = title;
            document.getElementById('preview-author').textContent = author;
            document.getElementById('preview-category').textContent = category;
            document.getElementById('preview-date').textContent = new Date().toLocaleDateString();
            document.getElementById('preview-img').src = image;
            document.getElementById('preview-content').textContent = content;

            // Show modal
            document.getElementById('preview-modal').style.display = 'block';
        });

        // Close preview modal
        document.getElementById('close-preview').addEventListener('click', function() {
            document.getElementById('preview-modal').style.display = 'none';
        });

        document.getElementById('edit-btn').addEventListener('click', function() {
            document.getElementById('preview-modal').style.display = 'none';
        });

        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            const modal = document.getElementById('preview-modal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });

        // Form submission (Publish)
        document.getElementById('blog-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = {
                title: document.getElementById('title').value.trim(),
                author: document.getElementById('author').value.trim(),
                category: document.getElementById('category').value,
                image: document.getElementById('image').value.trim() || 'https://via.placeholder.com/400x200',
                content: document.getElementById('content').value.trim()
            };

            // Validate required fields
            if (!formData.title || !formData.author || !formData.category || !formData.content) {
                document.getElementById('error-alert').textContent = 'Please fill in all required fields.';
                document.getElementById('error-alert').style.display = 'block';
                document.getElementById('success-alert').style.display = 'none';
                return;
            }

            // Show loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('publish-btn').disabled = true;

            try {
                const response = await fetch('/api/add_blog', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (response.ok) {
                    document.getElementById('success-alert').textContent = 'Blog published successfully!';
                    document.getElementById('success-alert').style.display = 'block';
                    document.getElementById('error-alert').style.display = 'none';

                    // Reset form
                    document.getElementById('blog-form').reset();

                    // Redirect to blogs page after a short delay
                    setTimeout(() => {
                        window.location.href = '/blogs';
                    }, 2000);
                } else {
                    throw new Error(result.error || 'Failed to publish blog');
                }
            } catch (error) {
                console.error('Publish error:', error);
                document.getElementById('error-alert').textContent = error.message || 'Failed to publish blog. Please try again.';
                document.getElementById('error-alert').style.display = 'block';
                document.getElementById('success-alert').style.display = 'none';
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('publish-btn').disabled = false;
            }
        });

        // Publish from preview modal
        document.getElementById('confirm-publish').addEventListener('click', function() {
            document.getElementById('preview-modal').style.display = 'none';
            document.getElementById('blog-form').dispatchEvent(new Event('submit'));
        });

        // Auto-correct functionality
        document.getElementById('correct-btn').addEventListener('click', async function() {
            const contentTextarea = document.getElementById('content');
            const text = contentTextarea.value.trim();

            if (!text) {
                alert('Please enter some text to correct.');
                return;
            }

            // Show loading
            document.getElementById('loading').style.display = 'block';
            this.disabled = true;

            try {
                const response = await fetch('/api/correct_text', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text: text })
                });

                const result = await response.json();

                if (response.ok && result.corrected_text) {
                    contentTextarea.value = result.corrected_text;
                    if (result.suggestions && Object.keys(result.suggestions).length > 0) {
                        const suggestions = Object.entries(result.suggestions)
                            .map(([original, corrected]) => `${original} → ${corrected}`)
                            .join('\n');
                        alert('Text corrected! Suggestions:\n' + suggestions);
                    } else {
                        alert('Text corrected successfully!');
                    }
                } else {
                    throw new Error(result.error || 'Failed to correct text');
                }
            } catch (error) {
                console.error('Auto-correct error:', error);
                alert('Auto-correct failed: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
                this.disabled = false;
            }
        });

        // Translate functionality
        document.getElementById('translate-btn').addEventListener('click', function() {
            const translationPanel = document.getElementById('translation-panel');
            translationPanel.style.display = translationPanel.style.display === 'block' ? 'none' : 'block';
        });

        document.getElementById('do-translate').addEventListener('click', async function() {
            const contentTextarea = document.getElementById('content');
            const text = contentTextarea.value.trim();
            const language = document.getElementById('translate-lang').value;

            if (!text) {
                alert('Please enter some text to translate.');
                return;
            }

            if (!language) {
                alert('Please select a language.');
                return;
            }

            // Show loading
            document.getElementById('loading').style.display = 'block';
            this.disabled = true;

            try {
                const response = await fetch('/api/translate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text: text, language: language })
                });

                const result = await response.json();

                if (response.ok && result.translated_text) {
                    document.getElementById('translation-result').value = result.translated_text;
                } else {
                    throw new Error(result.error || 'Translation failed');
                }
            } catch (error) {
                console.error('Translation error:', error);
                alert('Translation failed: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
                this.disabled = false;
            }
        });

        document.getElementById('close-translate').addEventListener('click', function() {
            document.getElementById('translation-panel').style.display = 'none';
        });

        // Summarize functionality
        document.getElementById('summarize-btn').addEventListener('click', async function() {
            const contentTextarea = document.getElementById('content');
            const text = contentTextarea.value.trim();

            if (!text) {
                alert('Please enter some text to summarize.');
                return;
            }

            // Show loading
            document.getElementById('loading').style.display = 'block';
            this.disabled = true;

            try {
                const response = await fetch('/api/summarize', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text: text })
                });

                const result = await response.json();

                if (response.ok && result.summary) {
                    contentTextarea.value = result.summary;
                    alert('Text summarized successfully!');
                } else {
                    throw new Error(result.summary || 'Failed to summarize text');
                }
            } catch (error) {
                console.error('Summarize error:', error);
                alert('Summarization failed: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
                this.disabled = false;
            }
        });



        // ... (The rest of your JavaScript for Auto-Correct, Translate, Summarize, etc. remains here)
    </script>
</body>
</html>
